name: CI

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

jobs:
  build-and-test:
    name: build-and-test (self-hosted)
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - name: Checkout anvil-host
        uses: actions/checkout@v6
        with:
          path: swiftanvil-anvil-host

      - name: Checkout anvil-runner sibling
        uses: actions/checkout@v6
        with:
          repository: swiftanvil/swiftanvil-anvil-runner
          path: swiftanvil-anvil-runner

      - name: Select Swift 6 toolchain
        run: |
          if [ -d /Applications/Xcode_16.2.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          fi

      - name: Tool versions
        run: |
          swift --version
          xcodebuild -version

      - name: Build
        working-directory: swiftanvil-anvil-host
        run: swift build

      - name: Test
        working-directory: swiftanvil-anvil-host
        run: |
          if [ -d Tests ]; then
            swift test
          else
            echo "No Tests directory; skipping swift test"
          fi

      - name: CLI smoke
        working-directory: swiftanvil-anvil-host
        run: |
          # Force a clean release build so ProjectPaths picks up the current source.
          swift package clean
          swift build -c release
          .build/release/anvil-host help
